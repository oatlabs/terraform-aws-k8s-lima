name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 06:00 UTC — catches new checks published against unchanged code.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: trivy config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      # upload-sarif resolves the workflow run to build its analysis key;
      # that API is gated behind actions:read on private repos.
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Two passes on purpose: the first reports everything to the Security tab
      # without ever failing the build, the second is the gate.
      - name: Scan to SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Upload to code scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-config

      - name: Fail on HIGH and CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore
