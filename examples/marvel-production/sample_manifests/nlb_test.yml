apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlb-test
spec:
  replicas: 2
  selector:
    matchLabels: { app: nlb-test }
  template:
    metadata:
      labels: { app: nlb-test }
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nlb-test
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app: nlb-test
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
