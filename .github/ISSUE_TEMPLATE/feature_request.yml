name: Feature request
description: Suggest a capability this module should have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: If it changes the `config` schema, show the JSON you would want to write.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Workarounds you have already used, and why they fall short.
